<ng-container>
  <div class="header">
    <img src="https://static.smite.guru/i/avatars/0.png" alt="avatar">
    <div class="info">
      <p>{{player.name}}</p>
      <p>{{player.team}}-{{player.region}}</p>
    </div>
  </div>
  <div class="stats">
    <small>Last seen {{date()}}</small>
    <br>
    <small>Playtime {{playtime()}}</small>
  </div>
</ng-container>
