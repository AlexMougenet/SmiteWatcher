<ng-container>
  <div class="column">
    <app-search [placeholder]="currentPlayer[1]" (search)="search(1, $event)"></app-search>
  
    <div class="container-result" *ngIf="showSearchResults[1]">
      <div *ngFor="let p of players[1]">
        <app-search-result [player]="p" (click)="display(1, p)"></app-search-result>
      </div>
    </div>
  
    <div class="container-player" *ngIf="!showSearchResults[1]">
      <div>
        <app-select [value]="filter[1].queue" [source]="queues" (selectQueue)="setQueue(1, $event)"></app-select>
      </div>
      <div>
        <app-auto-complete [source]="api.gods" [value]="filter[1].god.name" (selectGod)="setGod(1, $event)"></app-auto-complete>
      </div>

      <app-global-info *ngIf="showStats(1)" [stats]="stats[1].queues[filter[1].queue]" [matches]="matches[1]"></app-global-info>
  
      <div *ngFor="let m of matches[1]">
        <app-match-result *ngIf="showMatch(1, m)" [match]="m" (display)="display(1, $event)" class="{{ isWin(m) }}"></app-match-result>
      </div>
    </div>
  </div>
  <div class="column">
    <app-search [placeholder]="currentPlayer[2]" (search)="search(2, $event)"></app-search>

    <div class="container-result" *ngIf="showSearchResults[2]">
      <div *ngFor="let p of players[2]">
        <app-search-result [player]="p" (click)="display(2, p)"></app-search-result>
      </div>
    </div>
  
    <div class="container-player" *ngIf="!showSearchResults[2]">
      <div>
        <app-select [value]="filter[2].queue" [source]="queues" (selectQueue)="setQueue(2, $event)"></app-select>

      <app-global-info *ngIf="showStats(2)" [stats]="stats[2].queues[filter[2].queue]" [matches]="matches[2]"></app-global-info>

      <div *ngFor="let m of matches[2]">
        <app-match-result *ngIf="showMatch(2, m)" [match]="m" (display)="display(2, $event)" class="{{ isWin(m) }}"></app-match-result>
      </div>
    </div>
  </div>
  <div class="column">
    <app-search [placeholder]="currentPlayer[3]" (search)="search(3, $event)"></app-search>

      <div *ngFor="let p of players[3]">

        <app-match-result *ngIf="showMatch(3, m)" [match]="m" (display)="display(3,$event)" class="{{ isWin(m) }}"></app-match-result>
      </div>
    </div>
  </div>
</ng-container>
